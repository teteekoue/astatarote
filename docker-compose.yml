# =============================================================================
# Astatarote SaaS — déploiement production (mono-conteneur)
#   docker compose up -d --build
# L'application (API + WebSockets + frontend buildé) est servie sur :8000
# =============================================================================

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Base de données persistée dans le volume db_data
      - DATABASE_URL=sqlite:////data/astarote.db
      # À SURCHARGER EN PRODUCTION (docker compose override ou .env) :
      - ASTAROTE_SECRET_KEY=${ASTAROTE_SECRET_KEY:-asta-change-me-in-production}
      - ASTAROTE_TOKEN_EXPIRE_MINUTES=${ASTAROTE_TOKEN_EXPIRE_MINUTES:-1440}
      - ASTAROTE_BOOTSTRAP_ADMIN=${ASTAROTE_BOOTSTRAP_ADMIN:-false}
      - ASTAROTE_CORS_ORIGINS=${ASTAROTE_CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - db_data:/data
    restart: always

volumes:
  db_data:
